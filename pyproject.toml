[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-agent"
version = "0.1.0"
description = "Python REPL-based coding assistant."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[project.scripts]
coda = "code_agent.agent:main"

[tool.setuptools.packages.find]
include = ["code_agent*"]

[tool.setuptools.package-data]
code_agent = [
  "skills/**/*.md",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = '-m "not integration"'
markers = [
  "integration: live process, namespace, mount, or network integration tests",
]
